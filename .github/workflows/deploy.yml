name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Inspect build output
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== dist ==="
          ls -la dist || true
          echo "=== .output ==="
          ls -la .output || true
          echo "=== .output/public ==="
          ls -la .output/public || true
          echo "=== Looking for index.html ==="
          find .output -name "index.html" -print || true

      - name: Prepare GitHub Pages
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "ERROR: .output/public/index.html was not found."
            echo "Files in .output/public:"
            find .output/public -maxdepth 2 -type f -print
            exit 1
          fi

          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
