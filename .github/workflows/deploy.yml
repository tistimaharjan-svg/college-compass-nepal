name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      -- name: Setup Node
  uses: actions/setup-node@v4
  with:
    node-version: 20

      - name: Install dependencies
        run: npm install


      - name: Inspect build output
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== dist ==="
          ls -la dist || true
          echo "=== .output ==="
          ls -la .output || true

      - name: Prepare GitHub Pages
        run: |
          if [ -d dist ]; then
            cp dist/index.html dist/404.html 2>/dev/null || true
            touch dist/.nojekyll
          elif [ -d .output/public ]; then
            cp .output/public/index.html .output/public/404.html 2>/dev/null || true
            touch .output/public/.nojekyll
          else
            echo "ERROR: No static build output found."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            dist
            .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
